services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment: { POSTGRES_USER: mobila, POSTGRES_PASSWORD: mobila, POSTGRES_DB: mobila }
    volumes: [mobila_pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mobila -d mobila"]
      interval: 3s
      timeout: 3s
      retries: 20
  web:
    build: .
    restart: unless-stopped
    ports: ["${HOST_PORT:-8000}:8000"]
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/mobila
      DB_USER: mobila
      DB_PASSWORD: mobila
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin123!}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER2: ${SMTP_USER2:-}
      SMTP_PASSWORD2: ${SMTP_PASSWORD2:-}
      SMTP_HOST2: ${SMTP_HOST2:-}
      GMAIL_RELAY_URL: ${GMAIL_RELAY_URL:-}
      GMAIL_RELAY_TOKEN: ${GMAIL_RELAY_TOKEN:-}
      CHAT_MODEL: ${CHAT_MODEL:-claude-haiku-5-5}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:${HOST_PORT:-8000}}
    depends_on:
      db:
        condition: service_healthy
volumes:
  mobila_pgdata:
