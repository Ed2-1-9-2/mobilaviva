app = "mobilaviva-1205413489"
primary_region = "fra"

[env]
  PORT = "8000"
  COOKIE_SECURE = "true"
  APP_BASE_URL = "https://mobilaviva-1205413489.fly.dev"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

swap_size_mb = 512

[[restart]]
  policy = "always"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
