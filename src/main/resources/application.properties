server.port=${PORT:8000}
# Publicare (Render/Railway): aplicația rulează în spatele unui proxy HTTPS
server.forward-headers-strategy=framework
# Doar PostgreSQL. Local: run.sh pornește un container PostgreSQL (Docker); online: DATABASE_URL de la Render/Neon etc.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/mobila}
spring.datasource.username=${DB_USER:mobila}
spring.datasource.password=${DB_PASSWORD:mobila}
# update: schema creată/actualizată automat. În producție: DDL_AUTO=validate după prima pornire
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
# Neon/Fly taie conexiunile inactive: nu păstrez conexiuni vechi (altfel prima cerere după pauză dă eroare 500 și login-ul „nu merge”)
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.keepalive-time=120000
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.validation-timeout=5000
spring.jackson.serialization.write-dates-as-timestamps=false
server.servlet.session.timeout=2h
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true
# true pe hosting cu HTTPS (Render/Railway); false pe http://mobilaviva.com local
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
# PageSpeed: compresie
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,text/javascript,application/javascript,application/json,image/svg+xml
server.compression.min-response-size=256
# Plăți: cheia secretă Stripe (sk_test_..., din .env) activează Stripe Checkout; fără ea se folosește cardul simulat
stripe.secret-key=${STRIPE_SECRET_KEY:}
# Webhook Stripe (whsec_...): fără el, endpoint-ul /api/stripe/webhook respinge cererile
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY:}
# IBAN afișat la plata prin transfer bancar (pune IBAN-ul real în SHOP_IBAN)
shop.iban=${SHOP_IBAN:RO49AAAA1B31007593840000}
app.base-url=${APP_BASE_URL:http://localhost:8000}
# Asistent AI: cheia Anthropic din .env activează modul „ai”; fără ea asistentul rulează local (căutare în catalog)
chat.api-key=${ANTHROPIC_API_KEY:}
chat.model=${CHAT_MODEL:claude-haiku-5-5}
chat.daily-limit=${CHAT_DAILY_LIMIT:300}
